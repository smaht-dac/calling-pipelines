## Workflow information #####################################
#     General information for the workflow
#############################################################
name: delly_sr
description: Run Delly on short-read data (Illumina). |
             Produce structural variant calls in VCF format.  |
             Accept a single merged short-read CRAM file as input

runner:
  language: cwl
  main: delly_sr.cwl

software:
  - Delly@v1.7.3
  - Bcftools@1.17

category:
  - Variant Calling

## Input information ########################################
#     Input files and parameters
#############################################################
input:

  # Required file arguments
  input_file_cram:
    argument_type: file.cram

  genome_reference_fasta:
    argument_type: file.fa
  
  exclude_tsv:
    argument_type: file.tsv

## Output information #######################################
#     Output files
#############################################################
output:

  output_file_vcf_gz:
    argument_type: file.vcf_gz
    secondary_files:
      - vcf_gz_tbi