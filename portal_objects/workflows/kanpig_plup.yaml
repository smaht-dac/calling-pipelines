## Workflow information #####################################
#     General information for the workflow
#############################################################
name: kanpig_plup
description: Structural variant pileups with kanpig. |
             Creates a pileup file from long-read sequencing data (PacBio HiFi / ONT) |
             in CRAM format to support structural variant calling.

runner:
  language: cwl
  main: kanpig_plup.cwl

software:
  - kanpig@v1.1.0

category:
  - Variant Calling

## Input information ########################################
#     Input files and parameters
#############################################################
input:

  # File inputs
  input_file_cram:
    argument_type: file.cram

  reference_fasta:
    argument_type: file.fa

  # Parameter inputs
  nthreads:
    # default: 8
    argument_type: parameter.integer

## Output information #######################################
#     Output files and quality controls
#############################################################
output:

  output_file_plup_gz:
    argument_type: file.plup_gz
    secondary_files:
      - plup_gz_tbi
