## Workflow information #####################################
#     General information for the workflow
#############################################################
name: manta
description: Run Manta in tumor-only mode for whole-genome structural variant calling. |
             Produce structural variant calls in VCF format. |
             Accepts a single tumor CRAM file as input

runner:
  language: cwl
  main: manta.cwl

software:
  - Manta@1.6.0

category:
  - Variant Calling

## Input information ########################################
#     Input files and parameters
#############################################################
input:

  # File inputs
  input_file_cram:
    argument_type: file.cram

  genome_reference_fasta:
    argument_type: file.fa

  # Optional parameter inputs
  nthreads:
    argument_type: parameter.integer

## Output information #######################################
#     Output files and quality controls
#############################################################
output:

  output_file_vcf_gz:
    argument_type: file.vcf_gz
    secondary_files:
      - vcf_gz_tbi

  output_file_candidate_vcf_gz:
    argument_type: file.vcf_gz
    secondary_files:
      - vcf_gz_tbi
